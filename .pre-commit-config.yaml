# Pre-commit hooks — ruff, gitleaks, bandit, mypy.
# uv operations (version bump, lock, sync, export) run automatically as
# hooks below on every `git commit` (which `make commit` just wraps).
#
# This file is synced into target repos by repo-file-sync-action — see
# .github/sync.yml in this repo. Don't edit it directly in a target repo;
# edit it here and let the sync PR carry the change out.
#
# First-time setup (per repo):
#   pre-commit install
#   pre-commit autoupdate   # pins hook revs to their actual latest release

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "bandit.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: ["--config-file=mypy.ini"]
        # mypy's own `exclude =` in mypy.ini is ignored for paths passed
        # explicitly on the command line, which is exactly how pre-commit
        # invokes it — so the skip list has to be repeated here.
        exclude: ^(tests/|mkdocs/)
        # mypy runs in its own isolated venv, so project deps aren't visible.
        # ignore_missing_imports = True in mypy.ini covers that; add stub
        # packages (e.g. "pandas-stubs", "types-requests") to
        # additional_dependencies per-repo to get real checking of a given lib.

  - repo: local
    hooks:
      - id: auto-bump-patch
        name: auto bump patch version
        language: script
        entry: scripts/auto_bump_patch.sh
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.25
    hooks:
      # uv-lock must run before uv-export: otherwise requirements.txt is
      # exported from the pre-upgrade lock and drifts from the final uv.lock.
      - id: uv-lock
        args: ["--upgrade"]
      - id: uv-export
        args: ["--frozen", "--output-file=requirements.txt", "--quiet"]
      - id: uv-sync
        # --compile-bytecode writes .pyc files up front. Without it, the venv
        # is rewritten on every commit (uv-lock --upgrade above) and the next
        # Jupyter kernel / CLI start pays the full compile cost of pandas,
        # numpy, etc. on first import — several seconds of apparent hang.
        args: ["--locked", "--all-packages", "--compile-bytecode"]

  - repo: local
    hooks:
      - id: tag-version
        name: tag version after commit
        language: script
        entry: scripts/tag_version.sh
        stages: [post-commit]
        always_run: true
        pass_filenames: false
