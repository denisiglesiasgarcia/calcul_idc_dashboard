; Type-checking config, synced from ci-templates. Deliberately lenient:
; most repos have no type hints yet, and mypy skips the bodies of unannotated
; functions by default, so this only checks code that is already annotated.
; Tighten per-repo (disallow_untyped_defs, strict) as coverage grows; add
; noisy codes to disable_error_code if a repo needs breathing room.
[mypy]
python_version = 3.13
strict = False
; Gradually enable these as you add type hints:
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
disallow_untyped_defs = False
; flip to True once all functions are annotated
ignore_missing_imports = True
; third-party libs without stubs (streamlit, pymongo…)
exclude = (tests/|mkdocs/)
